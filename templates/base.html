<!DOCTYPE html>
<html lang="{{ 'pt-BR' if idioma == 'pt' else 'en' }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('Plataforma Munguba') }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logotitulo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}">
    <link href="{{ url_for('static', filename='vendor/remixicon/remixicon.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'ValorePro';
            src: url("{{ url_for('static', filename='fonts/fonte.ttf') }}") format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .font-brand {
            font-family: 'ValorePro', serif !important;
            font-weight: normal !important;
            letter-spacing: 0px;
        }

        body { font-family: 'Inter', sans-serif; }
        .font-pacifico { font-family: 'Pacifico', cursive; }

        dialog[open] { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .nav-link:hover::after { width: 100%; }
        .nav-link::after {
            content: ''; display: block; width: 0; height: 2px;
            background: #059669; transition: width .3s;
        }
        .acoes-compartilhar { position: absolute; right: 1.5rem; top: 6rem; z-index: 50; display: flex; align-items: center; gap: 8px; }
        .botao-compartilhar { display: flex; align-items: center; gap: 6px; background: white; color: #064e3b; border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 3px #0002; }
        #modal-compartilhar { width: min(90vw, 410px); max-height: 90vh; margin: auto; border: 0; padding: 24px; border-radius: 20px; background: white; color: #064e3b; text-align: center; overflow-y: auto; }
        #modal-compartilhar::backdrop { background: #0008; }
        #modal-compartilhar h2 { font-size: 22px; font-weight: 700; }
        #modal-compartilhar p { font-size: 14px; color: #475569; margin-top: 12px; }
        #modal-compartilhar img { display: block; width: 100%; height: auto; margin: 16px auto; }
        #modal-compartilhar .fechar-compartilhar { display: block; margin-left: auto; padding: 4px 8px; font-size: 22px; line-height: 1; }
        #modal-compartilhar a { display: inline-block; border-radius: 12px; padding: 10px 16px; background: #064e3b; color: white; font-size: 14px; font-weight: 600; }
        @media (min-width: 768px) { .acoes-compartilhar { top: 5rem; } }
        @media (min-width: 1200px) { .acoes-compartilhar { top: 2rem; } }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
    <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
</head>
<body class="bg-gray-50 text-gray-800">

<header class="absolute top-0 w-full z-50 py-4">
    <div class="container mx-auto px-6 relative flex justify-between items-center h-14">

        <div class="group flex items-center gap-0 hover:gap-2 bg-white/90 backdrop-blur-md p-2 hover:px-4 rounded-full shadow-sm transition-all duration-500 ease-in-out cursor-pointer border border-transparent hover:border-emerald-100 relative z-20">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Munguba" class="h-10 w-auto">
            <div class="max-w-0 opacity-0 group-hover:max-w-[150px] group-hover:opacity-100 overflow-hidden transition-all duration-700 ease-out whitespace-nowrap">
                <h1 class="text-lg text-emerald-900 font-brand leading-none pl-1">Munguba</h1>
            </div>
        </div>

        <nav class="hidden md:flex absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 items-center gap-6 bg-white/90 backdrop-blur-md px-6 py-2 rounded-full shadow-lg border border-white/60 z-10">

    <button onclick="abrirCatalogo()" class="nav-link text-sm font-semibold text-gray-600 hover:text-emerald-700 transition-colors cursor-pointer whitespace-nowrap">
        {{ t('Acessar Catálogo') }}
    </button>

    <div class="w-px h-4 bg-gray-300"></div>
    <a href="#mapa-area" class="nav-link text-sm font-semibold text-gray-600 hover:text-emerald-700 transition-colors whitespace-nowrap">
        {{ t('Acessar Mapa') }}
    </a>

    <div class="w-px h-4 bg-gray-300"></div>
    <a href="{{ url_for('baixar_planilha', lang=idioma) }}" class="flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-4 py-1.5 rounded-full text-xs font-bold transition-all uppercase tracking-wide shadow-sm whitespace-nowrap hover:scale-105 active:scale-95">
        <i aria-hidden="true" class="ri-database-2-line text-sm"></i>
        {{ t('Exportar Dados') }}
    </a>

</nav>

        <nav aria-label="{{ t('Navegação principal no celular') }}" class="flex md:hidden gap-2 text-xs font-semibold">
            <button onclick="abrirCatalogo()" class="bg-white rounded-full px-3 py-2 text-emerald-900">{{ t('Catálogo') }}</button>
            <a href="#mapa-area" class="bg-white rounded-full px-3 py-2 text-emerald-900">{{ t('Mapa') }}</a>
            <a href="{{ url_for('baixar_planilha', lang=idioma) }}" class="bg-emerald-900 rounded-full px-3 py-2 text-white">{{ t('Exportar') }}</a>
        </nav>

    </div>
</header>

<div class="acoes-compartilhar">
    <button type="button" class="botao-compartilhar" onclick="abrirCompartilhar()" aria-haspopup="dialog" aria-controls="modal-compartilhar">
        <i class="ri-share-line" aria-hidden="true"></i> {{ t('Compartilhar') }}
    </button>
<nav aria-label="Language / Idioma" class="flex gap-1 bg-white rounded-full px-2 py-1 shadow-sm text-xs font-bold">
    <a href="{{ url_idioma('pt') }}" lang="pt-BR" hreflang="pt-BR" aria-label="Português" {% if idioma == 'pt' %}aria-current="page"{% endif %} class="px-2 py-1 rounded-full {{ 'bg-emerald-900 text-white' if idioma == 'pt' else 'text-emerald-900' }}">PT</a>
    <a href="{{ url_idioma('en') }}" lang="en" hreflang="en" aria-label="English" {% if idioma == 'en' %}aria-current="page"{% endif %} class="px-2 py-1 rounded-full {{ 'bg-emerald-900 text-white' if idioma == 'en' else 'text-emerald-900' }}">EN</a>
</nav>
</div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

<dialog id="modal-compartilhar" aria-labelledby="titulo-compartilhar">
    <button type="button" class="fechar-compartilhar" onclick="fecharCompartilhar()" aria-label="{{ t('Fechar compartilhamento') }}">&times;</button>
    <h2 id="titulo-compartilhar">{{ t('Compartilhar a plataforma') }}</h2>
    <p>{{ t('Aponte a câmera do celular para acessar a Munguba.') }}</p>
    <img data-src="{{ url_for('qrcode_plataforma') }}" alt="{{ t('QR Code da plataforma Munguba') }}" width="1024" height="1024" decoding="async">
    <a href="{{ url_for('qrcode_plataforma') }}" download="qrcode-munguba.png">{{ t('Baixar QR Code') }}</a>
</dialog>
<script>
    function abrirCompartilhar() {
        const modal = document.getElementById('modal-compartilhar');
        const imagem = modal.querySelector('img');
        if (!imagem.hasAttribute('src')) imagem.src = imagem.dataset.src;
        if (!modal.open) modal.showModal();
        travarScroll();
    }
    function fecharCompartilhar() {
        document.getElementById('modal-compartilhar').close();
    }
</script>

</body>
</html>
