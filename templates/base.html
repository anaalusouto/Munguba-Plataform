<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Munguba</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logotitulo.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Aponta para sua fonte personalizada */
        @font-face {
            font-family: 'ValorePro';
            src: url("{{ url_for('static', filename='fonts/fonte.ttf') }}") format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .font-brand {
            font-family: 'ValorePro', serif !important;
            font-weight: normal !important;
            letter-spacing: 0px;
        }

        body { font-family: 'Inter', sans-serif; }
        .font-pacifico { font-family: 'Pacifico', cursive; }

        dialog[open] { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Efeitinho verde ao passar o mouse nos links do menu */
        .nav-link:hover::after { width: 100%; }
        .nav-link::after {
            content: ''; display: block; width: 0; height: 2px;
            background: #059669; transition: width .3s;
        }
    </style>

     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

<header class="absolute top-0 w-full z-50 py-4">
    <div class="container mx-auto px-6 relative flex justify-between items-center h-14">

        <div class="group flex items-center gap-0 hover:gap-2 bg-white/90 backdrop-blur-md p-2 hover:px-4 rounded-full shadow-sm transition-all duration-500 ease-in-out cursor-pointer border border-transparent hover:border-emerald-100 relative z-20">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Munguba" class="h-12 w-auto">
            <div class="max-w-0 opacity-0 group-hover:max-w-[150px] group-hover:opacity-100 overflow-hidden transition-all duration-700 ease-out whitespace-nowrap">
                <h1 class="text-lg text-emerald-900 font-brand leading-none pl-1">Munguba</h1>
            </div>
        </div>

        <nav class="hidden md:flex absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 items-center gap-8 bg-white/80 backdrop-blur-md px-8 py-2.5 rounded-full shadow-sm border border-white/50 z-10">
            <button onclick="document.getElementById('modal-catalogo').showModal()" class="nav-link text-sm font-semibold text-gray-600 hover:text-emerald-700 transition-colors cursor-pointer whitespace-nowrap">
                Acessar Catálogo
            </button>
            <a href="#mapa-area" class="nav-link text-sm font-semibold text-gray-600 hover:text-emerald-700 transition-colors whitespace-nowrap">
                Acessar Mapa
            </a>
        </nav>

    </div>
</header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
